name: ci
on:
  push:
    branches: ['**']
env:
  REGISTRY: gitea.gacnikhome.duckdns.org
  IMAGE: gitea.gacnikhome.duckdns.org/tcg/omiyage-api
jobs:
  test:
    runs-on: host
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          NET="ci-$GITHUB_RUN_ID-$GITHUB_RUN_NUMBER"
          docker network create "$NET"
          trap 'docker rm -f "$NET-db" >/dev/null 2>&1; docker network rm "$NET" >/dev/null 2>&1' EXIT
          docker run -d --name "$NET-db" --network "$NET" -e POSTGRES_DB=omiyage_test -e POSTGRES_USER=omiyage -e POSTGRES_PASSWORD=omiyage --health-cmd "pg_isready -U omiyage" --health-interval 2s --health-retries 30 postgres:16
          until [ "$(docker inspect -f '{{.State.Health.Status}}' "$NET-db")" = healthy ]; do sleep 2; done
          docker run --rm --network "$NET" -e CI=true -e TEST_DB_URL="jdbc:postgresql://$NET-db:5432/omiyage_test" --user "$(id -u):$(id -g)" -e HOME=/tmp -e GRADLE_USER_HOME=/tmp/gradle -v "$PWD":/w -w /w gradle:9.3.0-jdk21 gradle --no-daemon test
      - name: Detekt
        run: |
          docker run --rm -v "$PWD":/w -w /w ghcr.io/detekt/detekt:latest detekt-cli --input src/main/kotlin --report txt:/w/build/detekt.txt --report html:/w/build/detekt.html || true
      - name: Dependency scan
        run: |
          docker run --rm -v "$PWD":/w -w /w aquasec/trivy:latest fs --scanners vuln --exit-code 0 .
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-${{ github.run_number }}
          path: build/reports/jacoco
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep only the 3 newest coverage reports
        if: always()
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          API: https://gitea.gacnikhome.duckdns.org/api/v1/repos/${{ github.repository }}/actions/artifacts
        run: |
          python3 - <<'EOF' || true
          import json, os, urllib.request
          def call(url, method="GET"):
              req = urllib.request.Request(url, method=method, headers={"Authorization": "token " + os.environ["CI_TOKEN"]})
              with urllib.request.urlopen(req) as r:
                  return json.load(r) if method == "GET" else None
          api = os.environ["API"]
          reports = [a for a in call(api + "?limit=100")["artifacts"] if a["name"].startswith("coverage-")]
          newest_first = sorted({a["name"]: a["id"] for a in sorted(reports, key=lambda a: a["id"])}.items(), key=lambda kv: kv[1], reverse=True)
          stale = {name for name, _ in newest_first[3:]}
          for a in reports:
              if a["name"] in stale:
                  call(api + "/" + str(a["id"]), "DELETE")
          EOF
  build:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: host
    steps:
      - uses: actions/checkout@v4
      - name: Build and push image
        run: |
          echo "${{ secrets.CI_TOKEN }}" | docker login "$REGISTRY" -u ci-bot --password-stdin
          TAG=$(echo "$GITHUB_SHA" | cut -c1-7)
          docker build  -f Dockerfile -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
      - name: Keep only the 5 newest local images
        run: |
          docker images "$IMAGE" --format '{{.ID}}' | awk '!seen[$0]++' | tail -n +6 | xargs -r docker rmi -f || true
          docker image prune -f
      - name: Bump image tag in homelab-gitops
        run: |
          TAG=$(echo "$GITHUB_SHA" | cut -c1-7)
          rm -rf gitops
          git clone "https://ci-bot:${{ secrets.CI_TOKEN }}@gitea.gacnikhome.duckdns.org/tcg/homelab-gitops.git" gitops
          cd gitops
          sed -i "s/newTag:.*/newTag: $TAG/" apps/omiyage-api/kustomization.yaml
          git -c user.name=ci-bot -c user.email=ci-bot@gacnikhome.duckdns.org commit -qam "omiyage-api: $TAG"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 3; done
