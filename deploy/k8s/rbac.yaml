# NOT applied by CI - the ci_job identity can't grant itself RBAC before it
# has any. Apply this yourself, once, with a kubeconfig that already has
# cluster access:
#   kubectl apply -f deploy/k8s/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omiyage-api-deployer
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omiyage-api-deployer-binding
  namespace: default
subjects:
  - kind: Group
    name: "gitlab:ci_job:tcg/omiyage-api"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: omiyage-api-deployer
  apiGroup: rbac.authorization.k8s.io
