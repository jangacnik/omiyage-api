# __IMAGE__ is substituted at deploy time with the image built by CI (see .gitea/workflows/ci.yaml).
#
# Needs, created once out of band (not by CI):
#   kubectl create secret generic omiyage-api-secrets \
#     --from-literal=db-host='...' --from-literal=db-port='5432' \
#     --from-literal=db-name='omiyage' --from-literal=db-user='...' \
#     --from-literal=db-password='...' --from-literal=meishi-jwt-secret='...'
#
# MEISHI_API_URL is a plain env value below (not secret), so the secret no longer needs the
# meishi-api-url key.
#
# Also needs "regcred" (shared cluster-wide docker-registry secret, already
# created for meishi-api/tcg-accumulator) so the cluster can pull the image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omiyage-api
  labels:
    app: omiyage-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omiyage-api
  template:
    metadata:
      labels:
        app: omiyage-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
      imagePullSecrets:
        - name: regcred
      containers:
        - name: app
          image: __IMAGE__
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: omiyage-api-secrets, key: db-host }
            - name: DB_PORT
              valueFrom:
                secretKeyRef: { name: omiyage-api-secrets, key: db-port }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: omiyage-api-secrets, key: db-name }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: omiyage-api-secrets, key: db-user }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: omiyage-api-secrets, key: db-password }
            - name: MEISHI_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: omiyage-api-secrets, key: meishi-jwt-secret }
            # Only set during a secret rotation (see ARCHITECTURE.md).
            - name: MEISHI_JWT_SECRET_PREVIOUS
              valueFrom:
                secretKeyRef: { name: omiyage-api-secrets, key: meishi-jwt-secret-previous, optional: true }
            - name: MEISHI_API_URL
              value: "http://meishi-api.default.svc.cluster.local:8080"
            - name: FRONTEND_ORIGIN
              value: "https://omiyage.gacnikhome.duckdns.org"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 896Mi
          # Generous window so a slow Flyway migration is not killed by the liveness probe.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
