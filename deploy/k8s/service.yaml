# NodePort - reachable on the LAN at http://<any-k8s-node-ip>:30082/...
apiVersion: v1
kind: Service
metadata:
  name: omiyage-api
  labels:
    app: omiyage-api
spec:
  type: NodePort
  selector:
    app: omiyage-api
  ports:
    - name: http
      port: 8081
      targetPort: http
      nodePort: 30082
