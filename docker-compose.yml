# Local dev only: credentials below are placeholders. Ports are bound to loopback only — not reachable from the LAN/internet even
# if this host's firewall is open. Never point this compose file at anything but a dev machine.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: omiyage
      POSTGRES_USER: omiyage
      POSTGRES_PASSWORD: omiyage
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - omiyage-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omiyage -d omiyage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  omiyage-postgres-data:
