# Local dev only: credentials below are placeholders, and MinIO's `omiyage` bucket is set to
# anonymous-read (object keys are random UUIDs, so this is a public-read-bucket pattern, not an
# open write/list). Ports are bound to loopback only — not reachable from the LAN/internet even
# if this host's firewall is open. Never point this compose file at anything but a dev machine.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: omiyage
      POSTGRES_USER: omiyage
      POSTGRES_PASSWORD: omiyage
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - omiyage-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omiyage -d omiyage"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: omiyage
      MINIO_ROOT_PASSWORD: omiyage123
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - omiyage-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 omiyage omiyage123 &&
      mc mb --ignore-existing local/omiyage &&
      mc anonymous set download local/omiyage
      "

volumes:
  omiyage-postgres-data:
  omiyage-minio-data:
