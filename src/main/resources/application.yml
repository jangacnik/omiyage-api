server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: omiyage-backend
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  data:
    web:
      pageable:
        max-page-size: 100
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  structured:
    format:
      console: logstash

omiyage:
  maintenance:
    soft-delete-retention-days: ${SOFT_DELETE_RETENTION_DAYS:90}
  meishi:
    jwt-secret: ${MEISHI_JWT_SECRET}
    jwt-secret-previous: ${MEISHI_JWT_SECRET_PREVIOUS:}
    api-url: ${MEISHI_API_URL:http://localhost:8080}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
