server:
  port: 8081

spring:
  application:
    name: omiyage-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:omiyage}
    username: ${DB_USER:omiyage}
    password: ${DB_PASSWORD:omiyage}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  data:
    web:
      pageable:
        max-page-size: 100
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

omiyage:
  meishi:
    jwt-secret: ${MEISHI_JWT_SECRET}
    api-url: ${MEISHI_API_URL:http://localhost:8080}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
