# Every Spring Data @Query lives here, one key per repository method: <Entity>.<method>, plus
# <Entity>.<method>.count for a paged query's count. Spring Data picks them up by name; native ones
# are marked @Query(nativeQuery = true) on the method. Values take input only through named bind
# parameters (:name), never concatenation; RepositoryQueryGuardTest enforces both rules.

# BasketRepository
BasketLine.purgeUntouchedSince=\
  DELETE FROM basket_lines WHERE user_id IN ( \
    SELECT user_id FROM basket_lines GROUP BY user_id HAVING MAX(updated_at) < :cutoff \
  )

# CategoryRepository
Category.purgeDeletedBefore=DELETE FROM categories WHERE deleted_at IS NOT NULL AND deleted_at < :cutoff

# CombineRequestRepository
CombineRequest.purgeReferencingPurgeableOrdersOrShipments=\
  DELETE FROM combine_requests \
  WHERE requester_order_id IN (SELECT id FROM orders WHERE deleted_at IS NOT NULL AND deleted_at < :cutoff) \
     OR target_shipment_id IN (SELECT id FROM shipments WHERE deleted_at IS NOT NULL AND deleted_at < :cutoff)

# InventoryItemImageRepository
InventoryItemImage.purgeDeletedBefore=DELETE FROM inventory_item_images WHERE deleted_at IS NOT NULL AND deleted_at < :cutoff

# InventoryItemRepository
InventoryItem.purgeDeletedBefore=DELETE FROM inventory_items WHERE deleted_at IS NOT NULL AND deleted_at < :cutoff
InventoryItem.search=\
  SELECT DISTINCT i FROM InventoryItem i \
  LEFT JOIN i.categories c \
  WHERE (:title = '' OR LOWER(i.title) LIKE LOWER(CONCAT('%', :title, '%'))) \
  AND (:categoryId IS NULL OR c.id = :categoryId) \
  AND (:status IS NULL OR i.status = :status) \
  AND (:inStockOnly = false OR i.stockQuantity > 0)

# MediaRepository
Media.isReferenced=\
  SELECT EXISTS (SELECT 1 FROM inventory_item_images WHERE object_key = :key) \
      OR EXISTS (SELECT 1 FROM order_items WHERE custom_image_key = :key)
Media.purgeUnreferencedBefore=\
  DELETE FROM media m \
  WHERE m.created_at < :cutoff \
    AND NOT EXISTS (SELECT 1 FROM inventory_item_images i WHERE i.object_key = m.object_key) \
    AND NOT EXISTS (SELECT 1 FROM order_items o WHERE o.custom_image_key = m.object_key)

# OrderRepository
Order.lockOrderCreation=SELECT CAST(pg_advisory_xact_lock(hashtext(:key)) AS text)
Order.findFiltered=\
  SELECT o FROM Order o WHERE (:status IS NULL OR o.status = :status) AND o.status NOT IN :excluded
Order.findFiltered.count=\
  SELECT COUNT(o) FROM Order o WHERE (:status IS NULL OR o.status = :status) AND o.status NOT IN :excluded
Order.findAllOrderByItemCountAsc=\
  SELECT o FROM Order o LEFT JOIN o.items i \
  WHERE (:status IS NULL OR o.status = :status) AND o.status NOT IN :excluded \
  GROUP BY o ORDER BY COUNT(i) ASC, o.createdAt DESC, o.id
Order.findAllOrderByItemCountAsc.count=\
  SELECT COUNT(o) FROM Order o WHERE (:status IS NULL OR o.status = :status) AND o.status NOT IN :excluded
Order.findAllOrderByItemCountDesc=\
  SELECT o FROM Order o LEFT JOIN o.items i \
  WHERE (:status IS NULL OR o.status = :status) AND o.status NOT IN :excluded \
  GROUP BY o ORDER BY COUNT(i) DESC, o.createdAt DESC, o.id
Order.findAllOrderByItemCountDesc.count=\
  SELECT COUNT(o) FROM Order o WHERE (:status IS NULL OR o.status = :status) AND o.status NOT IN :excluded
Order.purgeDeletedBefore=DELETE FROM orders WHERE deleted_at IS NOT NULL AND deleted_at < :cutoff
Order.detachShipment=UPDATE Order o SET o.shipment = null, o.version = o.version + 1 WHERE o.shipment.id = :shipmentId

# OrderItemRepository
OrderItem.purgeDeletedBefore=DELETE FROM order_items WHERE deleted_at IS NOT NULL AND deleted_at < :cutoff
OrderItem.detachInventoryItem=\
  UPDATE order_items oi \
  SET inventory_item_id = NULL, \
      custom_title = COALESCE(oi.custom_title, ii.title), \
      custom_description = COALESCE(oi.custom_description, ii.description), \
      condition = COALESCE(oi.condition, ii.condition), \
      custom_image_key = COALESCE(oi.custom_image_key, ( \
          SELECT img.object_key FROM inventory_item_images img \
          WHERE img.inventory_item_id = ii.id AND img.deleted_at IS NULL \
          ORDER BY img.sort_order ASC LIMIT 1 \
      )) \
  FROM inventory_items ii \
  WHERE oi.inventory_item_id = ii.id AND oi.inventory_item_id = :inventoryItemId

# ShipmentRepository
Shipment.purgeDeletedBefore=DELETE FROM shipments WHERE deleted_at IS NOT NULL AND deleted_at < :cutoff
